<!DOCTYPE html> <!-- 声明这是 HTML5 页面 -->
<html lang="zh-CN"> <!-- 页面主要语言：简体中文 -->
<head> <!-- 网页设置从这里开始 -->
    <meta charset="UTF-8"> <!-- 让中文正常显示，不出现乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <!-- 手机按设备宽度显示，禁止双指缩放 -->
    <title>给宝宝的一封信</title> <!-- 浏览器标签页名称 -->
    <style> /* 所有页面样式从这里开始 */
        * { margin: 0; padding: 0; box-sizing: border-box; } /* 清除默认边距；宽高包含边框和内边距 */

        html, body { width: 100%; height: 100%; } /* 页面根元素始终占满屏幕 */
        body { /* 整个页面的背景与基础设置 */
            font-family: Arial, sans-serif; /* 默认字体 */
            background: linear-gradient(135deg, #4169E1, #1E90FF); /* 蓝色渐变背景 */
            position: relative; /* 给绝对定位的气球提供参考区域 */
            overflow: hidden; /* 不允许页面出现滚动条 */
        }

        .decoration { position: absolute; z-index: 1; } /* 气球和彩纸：浮在背景上，但在内容下方 */
        .balloon { /* 气球本体 */
            width: 30px; /* 气球宽度 */
            height: 40px; /* 气球高度 */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* 气球的椭圆形状 */
            position: relative; /* 为气球绳子提供定位依据 */
            animation: float 3s ease-in-out infinite; /* 上下漂浮动画 */
        }
        .balloon::before { /* 气球下方的细绳 */
            content: ''; position: absolute; bottom: -8px; left: 50%; /* 绳子置于气球底部中央 */
            transform: translateX(-50%); width: 1px; height: 12px; /* 绳子的居中、宽度与长度 */
            background: rgba(255,255,255,0.4); /* 半透明白色绳子 */
        }
        .balloon-1 { background: #FFD700; top: 3%; left: 3%; } /* 黄色气球：左上 */
        .balloon-2 { background: #FF69B4; top: 6%; right: 5%; animation-delay: .5s; } /* 粉色气球：右上 */
        .balloon-3 { background: #00BFFF; top: 12%; left: 8%; animation-delay: 1s; } /* 蓝色气球：左侧 */
        .balloon-4 { background: #FF6347; top: 20%; right: 3%; animation-delay: 1.5s; } /* 红色气球：右侧 */
        .balloon-5 { background: #98FB98; top: 30%; left: 5%; animation-delay: .3s; } /* 绿色气球：左下 */
        .balloon-6 { background: #FFA500; top: 8%; right: 12%; animation-delay: .8s; } /* 橙色气球：右上 */
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } } /* 气球上下移动 8px */

        body > .main-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100svh !important;

            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: flex-start !important;
            gap: 0.5vh !important;

            padding: 0 4vw 1vh !important;
        }

        .title-section { width: 100%; text-align: center; flex-shrink: 0;margin-top: 3vh; } /* 标题区：满宽且文字居中 */
        h1 { /* Happy Birthday 标题 */
            color: white; font-size: 2rem; /* 白色、字号；改 font-size 可调标题大小 */
            text-shadow: 2px 2px 4px rgba(0,0,0,.3); /* 标题阴影 */
            font-weight: bold; line-height: 1.1; /* 加粗与行高 */
        }
        .banner { /* PARTY 黄色横条 */
            background: #FFD700; color: #4169E1; /* 黄底蓝字 */
            padding: 8px 12px; border-radius: 6px; /* 横条的高度、左右内边距与圆角 */
            font-size: .9rem; font-weight: bold; margin-top: 20px; /* PARTY 字号、粗细、距标题距离 */
            box-shadow: 0 2px 4px rgba(0,0,0,.2); display: block; text-align: center; /* 阴影与文字居中 */
        }

        .cake-section { width: 100%; display: flex; justify-content: center; flex-shrink: 0;margin-top: 4vh;margin-bottom: 0vh;} /* 蛋糕所在行，蛋糕水平居中 */
        .cake { /* 蛋糕整体尺寸 */
            width: min(42vw, 160px); /* 蛋糕宽：屏宽 42%，最大 160px；改小即可缩小蛋糕 */
            height: min(34vw, 130px); /* 蛋糕高：屏宽 34%，最大 130px */
            position: relative; /* 蜡烛相对蛋糕定位 */
        }
        .cake-layer { width: 100%; border-radius: 5px; position: relative; border: 2px solid rgba(255,255,255,.5); } /* 每一层蛋糕的共同外观 */
        .cake-layer-1 { height: 46px; background: linear-gradient(45deg,#FFB6C1,#FF69B4); z-index: 3; } /* 顶层粉色蛋糕 */
        .cake-layer-2 { height: 46px; background: linear-gradient(45deg,#FFD700,#FFA500); z-index: 2; margin-top: -6px; } /* 中层黄色蛋糕；负边距让层叠起来 */
        .cake-layer-3 { height: 46px; background: linear-gradient(45deg,#87CEEB,#4169E1); z-index: 1; margin-top: -6px; } /* 底层蓝色蛋糕 */
        .icing { /* 每层底部的波浪奶油 */
            position: absolute; bottom: -2px; left: 0; right: 0; height: 13px; /* 奶油的位置与高度 */
            clip-path: polygon(0 100%,10% 0,20% 100%,30% 0,40% 100%,50% 0,60% 100%,70% 0,80% 100%,90% 0,100% 100%); /* 波浪锯齿形状 */
        }
        .icing-1 { background: #FFB6C1; } /* 顶层奶油颜色 */
        .icing-2 { background: #FFD700; } /* 中层奶油颜色 */
        .icing-3 { background: #87CEEB; } /* 底层奶油颜色 */
        .candle { width: 6px; height: 28px; background: #FFD700; position: absolute; top: -23px; border-radius: 1px; } /* 蜡烛大小和距蛋糕顶端的位置 */
        .candle-1 { left: 30%; } /* 第一根蜡烛横向位置 */
        .candle-2 { left: 50%; } /* 第二根蜡烛横向位置 */
        .candle-3 { left: 70%; } /* 第三根蜡烛横向位置 */
        .flame { width: 5px; height: 14px; background: radial-gradient(circle,#FF4500,#FFD700); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); animation: flicker 1s ease-in-out infinite alternate; } /* 火焰的尺寸、位置、颜色和闪烁 */
        @keyframes flicker { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.2); } } /* 火焰闪烁动画 */

        .frame-section { /* 相框所在的第三行 */
            width: 100%; min-height: 0; overflow: hidden; /* 允许相框缩小，不让它把播放器挤出屏幕 */
            display: flex; align-items: flex-start; justify-content: center; /* 相框居中 */
        }
        .photo-frame { background: transparent; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: block; width: 100%; max-height: 100%; margin: 0 auto; } /* 相框外层 */
        .frame-content { /* 图片的可见区域 */
            width: 100%; height: 54vh; max-height: 54dvh; /* 相框最高约占屏幕 27%；改这里可调相框高度 */
            aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; /* 4:3 比例且内容居中 */
            overflow: hidden; border-radius: 8px; background: transparent; /* 裁切超出部分、圆角与半透明底色 */
        }
        .frame-content { position: relative; } /* 让照片与相框可叠放 */
        .memory-photo { /* 放入相框中央的照片 */
            position: absolute;
            z-index: 1;
            width: 44%;
            height: 58%;
            left: 28%;
            top: 25%;
            object-fit: cover;
        }
        .frame-overlay { /* 保持在照片最上层的彩色相框 */
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .player-section { width: 100%; display: flex; justify-content: center; flex-shrink: 0; } /* 播放器所在最底行 */
        .music-player { background: linear-gradient(45deg,#FFD700,#FFA500); padding: 6px 10px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.2); width: 92%; margin: 0 auto; } /* 播放器外观和宽度；92% 控制左右留白 */
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 4px; } /* 按钮横排、间隔 8px */
        .control-btn { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.3); border: 1.5px solid #4169E1; color: #4169E1; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; } /* 普通圆形控制按钮 */
        .play-btn { width: 30px; height: 30px; font-size: 13px; } /* 中间播放键更大 */
        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,.3); border-radius: 4px; cursor: pointer; margin-bottom: 2px; } /* 进度条底槽 */
        .progress-bar { height: 100%; background: #4169E1; border-radius: 4px; width: 0%; } /* 蓝色播放进度 */
        .time-display { display: flex; justify-content: space-between; color: #4169E1; font-weight: bold; font-size: 9px; margin-top: 1px; } /* 左右显示时间 */
    </style> <!-- 样式结束 -->
</head>
<body> <!-- 网页可见内容开始 -->
    <div class="decoration balloon balloon-4"></div> <!-- 第 4 个气球 -->
    <div class="decoration balloon balloon-5"></div> <!-- 第 5 个气球 -->
    <div class="decoration balloon balloon-6"></div> <!-- 第 6 个气球 -->

    <main class="main-container"> <!-- 主内容：请不要拖动下面四个区块的先后顺序 -->
        <section class="title-section"> <!-- 第 1 行：标题区 -->
            <h1>Happy Birthday</h1> <!-- 大标题文字 -->
            <div class="banner">PARTY</div> <!-- 黄色 PARTY 横条 -->
        </section>
        <section class="cake-section"> <!-- 第 2 行：蛋糕区 -->
            <div class="cake"> <!-- 蛋糕整体 -->
                <div class="cake-layer cake-layer-1"><div class="icing icing-1"></div><div class="candle candle-1"><div class="flame"></div></div><div class="candle candle-2"><div class="flame"></div></div><div class="candle candle-3"><div class="flame"></div></div></div> <!-- 顶层和三根蜡烛 -->
                <div class="cake-layer cake-layer-2"><div class="icing icing-2"></div></div> <!-- 中层 -->
                <div class="cake-layer cake-layer-3"><div class="icing icing-3"></div></div> <!-- 底层 -->
            </div>
        </section>
        <section class="frame-section"> <!-- 第 3 行：相框区 -->
            <div class="photo-frame"><div class="frame-content"><img class="memory-photo" src="https://cdn.jsdelivr.net/gh/LiAo12318/gift@e625f7892fc45e4b8eebfc089b4a7540053b7d37/zhaopian1.jpg" alt="" fetchpriority="high" onerror="this.style.display='none'"><img class="frame-overlay" src="https://cdn.jsdelivr.net/gh/LiAo12318/gift@main/xiangkuang.png" alt="" fetchpriority="high" onerror="this.style.display='none'"></div></div> <!-- 照片与相框叠放 -->
        </section>
        <section class="player-section"> <!-- 第 4 行：播放器区 -->
            <div class="music-player"> <!-- 播放器黄色外框 -->
                <div class="player-controls"> <!-- 五个按钮 -->
                    <button class="control-btn">◀◀</button><button class="control-btn">◀</button><button class="control-btn play-btn">▶</button><button class="control-btn">▶</button><button class="control-btn">▶▶</button> <!-- 上一首、后退、播放、前进、下一首 -->
                </div>
                <div class="progress-container"><div class="progress-bar"></div></div> <!-- 进度条 -->
                <div class="time-display"><span>0:00</span><span>3:45</span></div> <!-- 时间显示 -->
            </div>
        </section>
    </main>

    <audio id="birthdayMusic" preload="none">
        <source src="https://cdn.jsdelivr.net/gh/LiAo12318/gift@06a742c77fe2873e7b1f38bb6c897afbb9ad8a69/text3.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>

    <script>
        // Connect the existing visual player to the music file.
        const audio = document.getElementById('birthdayMusic');
        const playButton = document.querySelector('.play-btn');
        const progressContainer = document.querySelector('.progress-container');
        const progressBar = document.querySelector('.progress-bar');
        const currentTimeText = document.querySelector('.time-display span:first-child');
        const totalTimeText = document.querySelector('.time-display span:last-child');

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return minutes + ':' + String(remainingSeconds).padStart(2, '0');
        }

        playButton.addEventListener('click', async () => {
            if (audio.paused) {
                try {
                    await audio.play();
                } catch (error) {
                    alert('音乐加载失败，请检查网络后再试。');
                }
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', () => { playButton.textContent = '||'; });
        audio.addEventListener('pause', () => { playButton.textContent = '▶'; });
        audio.addEventListener('loadedmetadata', () => { totalTimeText.textContent = formatTime(audio.duration); });
        audio.addEventListener('timeupdate', () => {
            currentTimeText.textContent = formatTime(audio.currentTime);
            progressBar.style.width = (audio.currentTime / audio.duration * 100 || 0) + '%';
        });
        audio.addEventListener('ended', () => {
            audio.currentTime = 0;
            progressBar.style.width = '0%';
        });
        progressContainer.addEventListener('click', (event) => {
            if (!Number.isFinite(audio.duration)) return;
            const rect = progressContainer.getBoundingClientRect();
            audio.currentTime = (event.clientX - rect.left) / rect.width * audio.duration;
        });
    </script>
</body>
</html> <!-- 页面结束 -->
