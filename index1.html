<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>夏日胶片 · 相册</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    :root { --ink:#fbf8ff; --muted:#bcb6ce; --pink:#ff4d9d; --violet:#885cff; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100dvh; background:#0b0914; color:var(--ink); font-family:"Noto Sans SC",sans-serif; display:grid; place-items:center; overflow:hidden; }
    .phone { width:min(100vw,430px); height:100dvh; min-height:680px; position:relative; overflow:hidden; isolation:isolate; background:#121020; }
    .orb { position:absolute; width:320px; height:320px; border-radius:50%; filter:blur(38px); opacity:.6; pointer-events:none; animation:float 11s ease-in-out infinite alternate; }
    .orb.one { background:#542cce; top:-150px; left:-120px; } .orb.two { background:#e62888; bottom:-160px; right:-140px; animation-delay:-4s; }
    .grain { position:absolute; inset:0; opacity:.15; pointer-events:none; z-index:4; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); mix-blend-mode:screen; }
    header { position:relative; z-index:5; padding:max(20px, env(safe-area-inset-top)) 24px 8px; }
    .eyebrow { margin:0 0 4px; font:500 10px/1 "DM Mono",monospace; letter-spacing:.14em; color:#dbd0f1; text-transform:uppercase; }.title { margin:0; font-size:23px; letter-spacing:-.06em; }
    main { position:relative; z-index:2; padding:16px 24px max(28px, env(safe-area-inset-bottom)); height:calc(100% - 64px); display:flex; flex-direction:column; }
    .intro { display:flex; align-items:end; justify-content:space-between; margin:7px 0 15px; }.intro h2 { font-size:30px; line-height:1.12; letter-spacing:-.07em; margin:0; }.intro span { font:10px "DM Mono"; color:var(--muted); padding-bottom:4px; }
    .stage { position:relative; flex:1; min-height:430px; perspective:1200px; touch-action:pan-y; user-select:none; }
    .photo { position:absolute; inset:0; border-radius:28px; overflow:hidden; box-shadow:0 22px 48px #0009; transform-origin:50% 110%; transition:transform .72s cubic-bezier(.2,.8,.2,1), opacity .5s ease, filter .5s ease; background:#272134; }
    .photo::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,#080610cf 100%); }
    .photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo:not(.active) { cursor:pointer; }.photo:nth-child(2) { transform:translate(12px,15px) rotate(4deg) scale(.94); }.photo:nth-child(3) { transform:translate(-11px,28px) rotate(-5deg) scale(.88); }.photo:nth-child(4) { transform:translate(7px,37px) rotate(7deg) scale(.82); }
    .photo.active { transform:translate(0) rotate(0) scale(1); z-index:4; }.photo.active img { animation:kenburns 7s ease-out both; }
    .photo-info { position:absolute; z-index:2; left:22px; right:22px; bottom:22px; display:flex; justify-content:space-between; align-items:end; }.photo-info strong { display:block; font-size:26px; letter-spacing:-.06em; }.photo-info small { display:block; margin-top:4px; color:#dfd9ea; font:10px "DM Mono"; }.num { font:500 13px "DM Mono"; border:1px solid #ffffff47; border-radius:100px; padding:7px 9px; backdrop-filter:blur(8px); }
    .swipe { position:absolute; z-index:5; bottom:10px; left:50%; translate:-50% 0; display:flex; align-items:center; gap:7px; width:max-content; color:#f3edf9c9; font:10px "DM Mono"; letter-spacing:.06em; }.line { width:28px; height:1px; background:currentColor; animation:pulse 1.7s ease-in-out infinite; }
    .flash { position:absolute; z-index:10; inset:0; pointer-events:none; background:#fff; opacity:0; }.flash.go { animation:flash .42s ease; }
    .star { position:absolute; z-index:12; pointer-events:none; color:#fff5b7; font-size:18px; line-height:1; text-shadow:0 0 7px #ffdc75,0 0 16px #ff50ae; animation:star-trail .72s ease-out forwards; }
    @keyframes float { to { transform:translate(52px,38px) scale(1.18); } } @keyframes kenburns { from { transform:scale(1.08); } to { transform:scale(1); } } @keyframes pulse { 50% { width:44px; opacity:.3; } } @keyframes flash { 20% { opacity:.9; } 100% { opacity:0; } } @keyframes star-trail { 0% { opacity:1; transform:translate(-50%,-50%) scale(.35) rotate(0deg); } 60% { opacity:1; } 100% { opacity:0; transform:translate(calc(-50% + var(--drift-x)),calc(-50% + var(--drift-y))) scale(1.45) rotate(105deg); } }
    @media (min-width:431px) { .phone { height:min(860px,100dvh); border-radius:38px; box-shadow:0 25px 90px #000; } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <section class="phone" aria-label="夏日胶片相册">
    <audio id="bgm" loop preload="auto" aria-hidden="true">
      <source src="https://raw.githubusercontent.com/LiAo12318/gift/5578a6d19963f074f3a78c4b81f39bd2b7077014/qingtian.mp3" type="audio/mpeg">
    </audio>
    <div class="orb one"></div><div class="orb two"></div><div class="grain"></div><div class="flash" id="flash"></div>
    <header><div><p class="eyebrow">MEMORIES / 2026</p><h1 class="title">夏日胶片</h1></div></header>
    <main><div class="intro"><h2>江仰彤，<br>我喜欢你。</h2><span id="counter">01 / 04</span></div>
      <div class="stage" id="stage">
        <article class="photo active"><img alt="珍藏照片 1" src="https://raw.githubusercontent.com/LiAo12318/gift/8dec7de2383474b3859c78cda964c883c1723150/20260813211743_65_104.jpg"><div class="photo-info"><div><strong>刚好遇见</strong></div><span class="num">01</span></div></article>
        <article class="photo"><img alt="珍藏照片 2" src="https://raw.githubusercontent.com/LiAo12318/gift/8dec7de2383474b3859c78cda964c883c1723150/20260813211744_66_104.jpg"><div class="photo-info"><div><strong>我们的瞬间</strong></div><span class="num">02</span></div></article>
        <article class="photo"><img alt="珍藏照片 3" src="https://raw.githubusercontent.com/LiAo12318/gift/8dec7de2383474b3859c78cda964c883c1723150/20260813211745_67_104.jpg"><div class="photo-info"><div><strong>心动时刻</strong></div><span class="num">03</span></div></article>
        <article class="photo"><img alt="珍藏照片 4" src="https://raw.githubusercontent.com/LiAo12318/gift/93bdeec91cd9db4157ccf1c0d2963be9626676e5/20260813212420_68_104.jpg"><div class="photo-info"><div><strong>特别的你</strong></div><span class="num">04</span></div></article>
      </div><div class="swipe"><i class="line"></i>SWIPE TO EXPLORE<i class="line"></i></div>
    </main>
  </section>
  <script>
    const cards=[...document.querySelectorAll('.photo')], stage=document.getElementById('stage'), counter=document.getElementById('counter'), flash=document.getElementById('flash'), bgm=document.getElementById('bgm'); let current=0,startX=0,lastX=0,lastY=0,dragging=false,lastStar=0;
    function show(index){ current=(index+cards.length)%cards.length; cards.forEach((c,i)=>{const pos=(i-current+cards.length)%cards.length;c.classList.toggle('active',pos===0);c.style.zIndex=4-pos;c.style.opacity=pos===3?.72:1;c.style.filter=pos?'brightness(.72) saturate(.75)':'none';});counter.textContent=`${String(current+1).padStart(2,'0')} / 04`; flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go'); }
    function sparkle(x,y){const now=performance.now();if(now-lastStar<34)return;lastStar=now;const box=stage.getBoundingClientRect(),star=document.createElement('i');star.className='star';star.textContent=Math.random()>.55?'✦':'✧';star.style.left=`${x-box.left}px`;star.style.top=`${y-box.top}px`;star.style.setProperty('--drift-x',`${(Math.random()-.5)*34}px`);star.style.setProperty('--drift-y',`${-18-Math.random()*32}px`);stage.append(star);star.addEventListener('animationend',()=>star.remove());}
    stage.addEventListener('pointerdown',e=>{dragging=true;startX=lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId);sparkle(lastX,lastY);});
    stage.addEventListener('pointermove',e=>{if(!dragging)return;const distance=Math.hypot(e.clientX-lastX,e.clientY-lastY);if(distance>7){sparkle(e.clientX,e.clientY);lastX=e.clientX;lastY=e.clientY;}});
    stage.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;if(Math.abs(e.clientX-startX)>45)show(current+(e.clientX<startX?1:-1));});
    stage.addEventListener('pointercancel',()=>dragging=false);
    function startMusic(){bgm.play().catch(()=>{});document.removeEventListener('pointerdown',startMusic);document.removeEventListener('keydown',startMusic);}
    bgm.volume=.42;startMusic();document.addEventListener('pointerdown',startMusic,{once:true});document.addEventListener('keydown',startMusic,{once:true});
  </script>
</body>
</html>
